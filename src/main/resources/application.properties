spring.application.name=backend

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
#spring.datasource.url=jdbc:mysql://mysql-cdy2203:3306/mydatabase
# La conexión apunta al contenedor creado con mysql/Dockerfile, publicado en el puerto 3307.
spring.datasource.url=jdbc:mysql://localhost:3307/mydatabase
spring.datasource.username=myuser
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Los niveles de log se bajan de TRACE/DEBUG a INFO: así la consola no se satura durante
# la ejecución de las pruebas y el resumen de Maven/JaCoCo queda legible.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=INFO
logging.level.com=INFO
logging.file.name=backend.log
server.port=8180
spring.main.allow-bean-definition-overriding=true
# Clave de firma de los JWT: se lee de la variable de entorno JWT_SECRET (mínimo 64 bytes).
# No se escribe en el repositorio.
jwt.secret=${JWT_SECRET}
